# Railway deploy — set root directory to backend/ in the dashboard, or deploy from backend/
[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w 1 --bind 0.0.0.0:$PORT"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
